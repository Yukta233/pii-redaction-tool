services:
  - type: web
    name: pii-redactor
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 120 app.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
